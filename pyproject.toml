[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "password-finder"
version = "2.2.3"
description = "Extract passwords from free-form text such as email bodies (e.g. a password for an encrypted attachment sent in a separate message)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["password", "extract", "parse", "email", "text", "regex"]
authors = [{ name = "District5" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "hypothesis>=6,<7"]

[project.scripts]
find-password = "password_finder.cli:find_password"
scan-emails = "password_finder.cli:scan_emails"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
