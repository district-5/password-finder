name: Release

# Publishes to PyPI when a v* tag is pushed, using Trusted Publishing (OIDC) --
# no API token is stored in this repository.
#
# One-time setup, both required before the first tag:
#   1. On PyPI: Account -> Publishing -> add a GitHub publisher with
#        owner: district-5   repo: py-password-extraction
#        workflow: release.yml   environment: pypi
#   2. On GitHub: Settings -> Environments -> create an environment named "pypi"
#        (adding required reviewers there gives you a manual gate before upload)
#
# Re-running after a failed publish: Actions -> Release -> Run workflow, and
# pick the tag. No need to delete and re-push the tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: pytest -q

      - name: Check the tag matches the project version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches version $version"

      - name: Build the sdist and wheel
        run: python -m build

      - name: Check the distribution metadata
        run: python -m twine check --strict dist/*

      - name: Confirm no test fixtures are in the sdist
        run: |
          if tar -tzf dist/*.tar.gz | grep -q "tests/"; then
            echo "::error::Test fixtures leaked into the sdist -- check MANIFEST.in"
            tar -tzf dist/*.tar.gz | grep "tests/"
            exit 1
          fi
          echo "No test fixtures in the sdist."

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
      contents: write   # required to create the GitHub release
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
